name: Deploy AdrienCoder API

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'

            - name: Restore
              run: dotnet restore AdrienCoder.slnx

            - name: Build
              run: dotnet build AdrienCoder.slnx --configuration Release --no-restore

            - name: Publish
              run: dotnet publish AdrienCoder.Api.csproj -c Release -o publish

            - name: Setup SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

            - name: Test SSH debug
              run: |
                  ssh -vvv -o BatchMode=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo connected"

            - name: Deploy to VPS
              run: |
                  ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ${{ secrets.VPS_APP_PATH }}"
                  rsync -avz --delete publish/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_PATH }}/

            - name: Restart service
              run: |
                  ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "sudo systemctl restart adriencoder && sudo systemctl status adriencoder --no-pager"

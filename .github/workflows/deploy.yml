name: Deploy AdrienCoder Server

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '10.0.x'

            - name: Restore
              run: dotnet restore AdrienCoder.sln

            - name: Build
              run: dotnet build AdrienCoder.sln --configuration Release --no-restore

            - name: Publish
              run: |
                  dotnet publish \
                    src/AdrienCoder.Server/AdrienCoder.Server.csproj \
                    -c Release \
                    -r linux-x64 \
                    --self-contained true \
                    -o publish

            - name: Prepare systemd service
              run: |
                  sed \
                    -e "s|__SERVICE_USER__|${{ secrets.VPS_USER }}|g" \
                    -e "s|__APP_PATH__|${{ secrets.VPS_APP_PATH }}|g" \
                    deploy/adriencoder.service > publish/adriencoder.service

            - name: Setup SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

            - name: Deploy to VPS
              run: |
                  ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ${{ secrets.VPS_APP_PATH }}"
                  rsync -avz --delete publish/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_PATH }}/

            - name: Install and restart service
              run: |
                  ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
                    set -eu

                    chmod +x "${{ secrets.VPS_APP_PATH }}/AdrienCoder.Server"
                    test -f "${{ secrets.VPS_APP_PATH }}/appsettings.json"

                    sudo install -m 0644 \
                      "${{ secrets.VPS_APP_PATH }}/adriencoder.service" \
                      /etc/systemd/system/adriencoder.service
                    sudo systemctl daemon-reload
                    sudo systemctl enable adriencoder
                    sudo systemctl restart adriencoder

                    if ! sudo systemctl is-active --quiet adriencoder; then
                      sudo systemctl status adriencoder --no-pager || true
                      sudo journalctl -u adriencoder -n 100 --no-pager
                      exit 1
                    fi
                  '

            - name: Verify VPS services
              run: |
                  ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
                    set -eu

                    for attempt in $(seq 1 20); do
                      if curl --fail --silent http://127.0.0.1:5000/api/health >/dev/null; then
                        break
                      fi

                      if [ "$attempt" -eq 20 ]; then
                        sudo journalctl -u adriencoder -n 100 --no-pager
                        exit 1
                      fi

                      sleep 1
                    done

                    curl --fail --silent http://127.0.0.1:5000/swagger/index.html >/dev/null
                    curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
                    curl --fail --silent http://127.0.0.1:6333/collections >/dev/null
                    sudo systemctl status adriencoder --no-pager
                  '

            - name: Verify public reverse proxy
              run: |
                  curl \
                    --fail \
                    --show-error \
                    --retry 5 \
                    --retry-delay 2 \
                    https://adrien-sheng-lin.fr/adriencoder/api/health
                  curl \
                    --fail \
                    --show-error \
                    --retry 5 \
                    --retry-delay 2 \
                    https://adrien-sheng-lin.fr/adriencoder/swagger/index.html \
                    >/dev/null

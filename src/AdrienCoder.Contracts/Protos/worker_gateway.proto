syntax = "proto3";

package adriencoder.worker.v1;

option csharp_namespace = "AdrienCoder.Contracts.Worker";

service WorkerGateway {
  rpc Connect(stream WorkerMessage) returns (stream ServerMessage);
}

message WorkerMessage {
  oneof payload {
    WorkerRegistration registration = 1;
    WorkerHeartbeat heartbeat = 2;
    JobResult job_result = 3;
    JobChunk job_chunk = 4;
  }
}

message WorkerRegistration {
  string worker_id = 1;
  string worker_name = 2;
  repeated string capabilities = 3;
  string model = 4;
}

message WorkerHeartbeat {
  string worker_id = 1;
  int64 unix_timestamp = 2;
}

message JobResult {
  string job_id = 1;
  bool success = 2;
  string response = 3;
  string error = 4;
}

message JobChunk {
  string job_id = 1;
  string delta = 2;
}

message ServerMessage {
  oneof payload {
    WorkerJob job = 1;
  }
}

message WorkerJob {
  string job_id = 1;
  string prompt = 2;
  bool stream = 3;
}
